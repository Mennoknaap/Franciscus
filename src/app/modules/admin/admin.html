<app-title previousPath="home">Gebruikersbeheer</app-title>

<div class="admin-container">
  <button mat-button class="migrate-sounds-btn" (click)="migrateSounds()">
    <mat-icon>cloud_sync</mat-icon>
    Geluiden migreren (eenmalig)
  </button>
  <button
    mat-fab
    color="primary"
    class="add-user-fab"
    (click)="addUser()"
    aria-label="Gebruiker toevoegen"
  >
    <mat-icon>add</mat-icon>
  </button>
  <div class="users-grid">
    @for (user of allUsers(); track user.id) {
      <div class="user-card">
        <img
          [src]="user.profilePicture"
          alt="Profielfoto van {{ user.firstName }}"
          class="profile-picture"
        />
        <div class="user-info">
          <h2>{{ user.firstName }} {{ user.lastName }}</h2>
          <p class="email">{{ user.email }}</p>
        </div>
        <button
          mat-icon-button
          class="menu-btn"
          [matMenuTriggerFor]="userMenu"
          aria-label="Gebruikersopties"
        >
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="editUser(user)">
            <mat-icon>edit</mat-icon>
            <span>Bewerken</span>
          </button>
          <button mat-menu-item (click)="manageUserAppAccess(user)">
            <mat-icon>apps</mat-icon>
            <span>App-toegang</span>
          </button>
          <button mat-menu-item (click)="deleteUser(user)">
            <mat-icon>delete</mat-icon>
            <span>Verwijderen</span>
          </button>
        </mat-menu>
      </div>
    }
  </div>
</div>
