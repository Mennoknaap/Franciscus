<app-title previousPath="home">Gebruikersbeheer</app-title>

<div class="admin-container">
  <button
    mat-fab
    color="primary"
    class="add-user-fab"
    (click)="addUser()"
    aria-label="Gebruiker toevoegen"
  >
    <mat-icon>add</mat-icon>
  </button>
  <div class="users-grid">
    @for (user of allUsers(); track user.id) {
      <div class="user-card">
        <img
          [src]="user.profilePicture"
          alt="Profielfoto van {{ user.firstName }}"
          class="profile-picture"
        />
        <div class="user-info">
          <h2>{{ user.firstName }} {{ user.lastName }}</h2>
          <p class="email">{{ user.email }}</p>
        </div>
        <button
          mat-icon-button
          class="edit-btn"
          (click)="editUser(user)"
          aria-label="Bewerk gebruiker"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          class="delete-btn"
          (click)="deleteUser(user)"
          aria-label="Verwijder gebruiker"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    }
  </div>
</div>
