<h2 mat-dialog-title>App-toegang — {{ data.user.firstName }} {{ data.user.lastName }}</h2>

<mat-dialog-content>
  @if (loading()) {
    <div class="loading-container">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  } @else {
    <mat-list>
      @for (app of apps; track app.key) {
        <mat-list-item>
          <mat-checkbox
            [checked]="hasAccess(app.key)"
            (change)="toggleAccess(app.key)"
          >
            {{ app.label }}
          </mat-checkbox>
        </mat-list-item>
      }
    </mat-list>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="null">Sluiten</button>
</mat-dialog-actions>
