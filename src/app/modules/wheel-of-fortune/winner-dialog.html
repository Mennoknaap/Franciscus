<h2 mat-dialog-title>🎉 Winnaar! 🎉</h2>
<mat-dialog-content>
  <p class="winner-text">
    {{ data.winner }}
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="'close'">Sluiten</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="'remove'">
    Verwijderen uit lijst
  </button>
</mat-dialog-actions>
