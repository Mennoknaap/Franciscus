<div class="hero">
  <div class="hero-date">{{ today }}</div>
  <app-title [hero]="true">{{ greeting }},<br />{{ user()?.firstName }}</app-title>
</div>

@if (showNotificationPrompt()) {
  <div class="notification-prompt">
    <mat-icon>notifications_active</mat-icon>
    <span>{{ notificationError() ?? 'Meldingen aanzetten?' }}</span>
    <button mat-flat-button [disabled]="enablingNotifications()" (click)="enableNotifications()">
      Aanzetten
    </button>
  </div>
}

<div class="section-label">Jouw apps</div>

<div class="app-grid">
  @for (app of visibleApps(); track app.title) {
    <a class="app-card" [class.disabled]="app.disabled" [routerLink]="app.path">
      <div class="app-card-icon" [style.background]="app.color"><mat-icon>{{ app.icon }}</mat-icon></div>
      <div class="app-card-title">{{ app.title }}</div>
    </a>
  }
</div>
