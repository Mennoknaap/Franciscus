<app-title>Welkom {{ user()?.firstName }}!</app-title>

@if (showNotificationPrompt()) {
  <div class="notification-prompt">
    <mat-icon>notifications_active</mat-icon>
    <span>{{ notificationError() ?? 'Meldingen aanzetten voor Poeplog?' }}</span>
    <button mat-button color="primary" [disabled]="enablingNotifications()" (click)="enableNotifications()">
      Aanzetten
    </button>
  </div>
}

<div class="app-grid">
  @for (app of visibleApps(); track app.title) {
    <div class="app-card" [class.disabled]="app.disabled">
      @if (app.icon) {
        <div class="app-card-img app-card-icon"><mat-icon>{{ app.icon }}</mat-icon></div>
      } @else {
        <img [src]="app.image" alt="{{ app.title }}" class="app-card-img" />
      }
      <div class="app-card-title">{{ app.title }}</div>
      <a class="app-card-link" mat-raised-button [routerLink]="app.path" [disabled]="app.disabled"
        >Openen</a
      >
    </div>
  }
</div>
