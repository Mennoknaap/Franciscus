<app-title previousPath="home">Top Secret</app-title>

<div class="poop-app-container">
  @if (notificationsEnabled()) {
    <p class="status">✓ Meldingen staan aan</p>
    <button mat-stroked-button (click)="enableNotifications()">
      <mat-icon>refresh</mat-icon>
      Vernieuw abonnement
    </button>
  } @else {
    <button mat-raised-button color="primary" (click)="enableNotifications()">
      <mat-icon>notifications</mat-icon>
      Meldingen aanzetten
    </button>
  }

  <button mat-raised-button color="warn" (click)="sendTestNotification()" [disabled]="sending()">
    <mat-icon>send</mat-icon>
    Stuur test-bericht naar iedereen
  </button>

  @if (countdown(); as seconds) {
    <p class="result">Wordt verstuurd over {{ seconds }} seconde{{ seconds === 1 ? '' : 'n' }} — vergrendel nu je telefoon of schakel naar een andere app.</p>
  } @else if (lastResult()) {
    <p class="result">{{ lastResult() }}</p>
  }
</div>
