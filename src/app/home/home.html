<app-title>Welkom Frans!</app-title>

<div class="app-grid">
  @for (app of apps; track app.title) {
    <div class="app-card">
      <img [src]="app.image" alt="{{ app.title }}" class="app-card-img" />
      <div class="app-card-title">{{ app.title }}</div>
      <a class="app-card-link" mat-raised-button [routerLink]="app.path">Openen</a>
    </div>
  }
</div>
