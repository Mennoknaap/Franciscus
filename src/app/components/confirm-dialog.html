<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  @for (line of messageLines; track line) {
    <p>{{ line }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">{{ data.cancelLabel ?? 'Annuleren' }}</button>
  <button mat-raised-button color="warn" [mat-dialog-close]="true">{{ data.confirmLabel ?? 'Verwijderen' }}</button>
</mat-dialog-actions>
