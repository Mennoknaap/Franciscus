@if (previousPath()) {
  <button class="title-button" matIconButton (click)="goBack()">
    <mat-icon>chevron_left</mat-icon>
  </button>
}

<h1><ng-content></ng-content></h1>

<button
  class="title-button menu"
  [style.background-image]="'url(' + user()?.profilePicture + ')'"
  matIconButton
  [matMenuTriggerFor]="menu"
  color="red"
></button>
<mat-menu #menu="matMenu">
  @if (user()?.role == 0) {
    <button mat-menu-item (click)="goToAdminPage()">Admin pagina</button>
  }
  <button mat-menu-item (click)="signOut()">uitloggen</button>
</mat-menu>
