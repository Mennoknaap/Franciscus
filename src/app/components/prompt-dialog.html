<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>{{ data.label ?? 'Naam' }}</mat-label>
    <input matInput [ngModel]="value()" (ngModelChange)="value.set($event)" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="null">Annuleren</button>
  <button mat-raised-button color="primary" [disabled]="!value().trim()" [mat-dialog-close]="value().trim()">
    {{ data.confirmLabel ?? 'OK' }}
  </button>
</mat-dialog-actions>
